name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Shkarko Kodin e Projektit
        uses: actions/checkout@v4

      - name: Konfiguro Node.js (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguro Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalo Paketet me Legacy Peer Deps
        run: |
          npm install --legacy-peer-deps

      - name: Siguro dosjen e Uebit (Kritike)
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Bridge</title></head><body><h1>Kontejneri Aktiv</h1></body></html>' > www/index.html

      - name: Shto dhe Sinkronizo Platformen Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Regjistro Modulin e NFC ne MainActivity (Kritike)
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/kompaniajote/hardwarebridge/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY" ]; then
            # Shto importin e modulit Capgo NFC në MainActivity
            sed -i '/import com.getcapacitor.BridgeActivity;/a import foo.bar.capacitor.nfc.CapgoNfcPrimary;' $MAIN_ACTIVITY
            # Regjistro plugin-in brenda onCreate (ose siguro inicializimin)
            sed -i '/public class MainActivity extends BridgeActivity/a \  @Override\n  public void onCreate(android.os.Bundle savedInstanceState) {\n    registerPlugin(foo.bar.capacitor.nfc.CapgoNfcPrimary.class);\n    super.onCreate(savedInstanceState);\n  }' $MAIN_ACTIVITY
            echo "MainActivity u përditësua me sukses!"
          else
            # Nëse është strukturë tjetër dosjesh, provojmë kërkimin dinamik
            MAIN_FILE=$(find android/ -name "MainActivity.java")
            if [ -f "$MAIN_FILE" ]; then
              sed -i '/import com.getcapacitor.BridgeActivity;/a import foo.bar.capacitor.nfc.CapgoNfcPrimary;' $MAIN_FILE
              echo "MainActivity dinamike u përditësua!"
            fi
          fi

      - name: Injekto Lejet e Harduerit (GPS, Kamera, NFC, Bluetooth)
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            # GPS
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>' $MANIFEST_PATH
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>' $MANIFEST_PATH
            # Kamera
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" \/>' $MANIFEST_PATH
            # NFC
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.NFC" \/>' $MANIFEST_PATH
            # Bluetooth
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.BLUETOOTH" \/>' $MANIFEST_PATH
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" \/>' $MANIFEST_PATH
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" \/>' $MANIFEST_PATH
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" \/>' $MANIFEST_PATH
            echo "Te gjitha lejet native u injektuan me sukses!"
          else
            echo "ERROR: AndroidManifest.xml nuk u gjet!"
            exit 1
          fi

      - name: Ndërto skedarin APK përmes Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ruaj dhe Eksporto Skedarin APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikacioni-yt-Gati
          path: android/app/build/outputs/apk/debug/app-debug.apk
