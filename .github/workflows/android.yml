name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Shkarko Kodin
        uses: actions/checkout@v4

      - name: Instalo Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalo Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalo Paketat
        run: |
          npm install
          mkdir -p www

      - name: Shto Platformen Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Ndërto skedarin APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Ruaj skedarin APK e gatshme
        uses: actions/upload-artifact@v4
        with:
          name: Aplikacioni-yt-Gati
          path: android/app/build/outputs/apk/debug/app-debug.apk
