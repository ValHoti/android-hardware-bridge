name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Shkarko Kodin e Projektit
        uses: actions/checkout@v4

      - name: Konfiguro Node.js (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguro Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalo Paketet e Node
        run: |
          npm install

      - name: Siguro dosjen e Uebit (Kritike)
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Bridge</title></head><body><h1>Kontejneri Aktiv</h1></body></html>' > www/index.html

      - name: Shto dhe Sinkronizo Platformen Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Ndërto skedarin APK përmes Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ruaj dhe Eksporto Skedarin APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikacioni-yt-Gati
          path: android/app/build/outputs/apk/debug/app-debug.apk
