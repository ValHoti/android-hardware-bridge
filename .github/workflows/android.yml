name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Shkarko Kodin e Projektit
        uses: actions/checkout@v4

      - name: Instalo Node.js Moderne
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalo Java 17 Moderne
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalo Paketet e Node
        run: |
          npm install

      - name: Siguro dosjen e Uebit
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><title>Bridge</title></head><body><h1>OK</h1></body></html>' > www/index.html

      - name: Inicializo Platformen Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Ndërto skedarin APK përmes Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info

      - name: Ruaj skedarin APK e gatshme
        uses: actions/upload-artifact@v4
        with:
          name: Aplikacioni-yt-Gati
          path: android/app/build/outputs/apk/debug/app-debug.apk
