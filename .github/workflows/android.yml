name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04

    # E domosdoshme për t'i dhënë leje GitHub Actions të krijojë Release
    permissions:
      contents: write

    steps:
      - name: Shkarko Kodin e Projektit
        uses: actions/checkout@v4

      - name: Konfiguro Node.js (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguro Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalo Paketet me Legacy Peer Deps
        run: |
          npm install --legacy-peer-deps

      # Patch-i aplikohet pas npm install, sepse nfcutils vjen nga npm.
      # Për tag-e që nuk janë Mifare Ultralight, kthen UID-në në vend që të
      # thërrasë connect() mbi null dhe të mbyllë aplikacionin.
      - name: Rregullo NFCUtils për kartela të tjera NFC
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plugin_file = Path(
              "node_modules/nfcutils/android/src/main/java/"
              "cloud/sandrin/plugins/nfcutils/NFCUtils.java"
          )

          if not plugin_file.is_file():
              raise SystemExit(f"Nuk u gjet skedari NFCUtils: {plugin_file}")

          source = plugin_file.read_text(encoding="utf-8")

          old_code = (
              "    MifareUltralight mifare = MifareUltralight.get(tag);\n"
              "    try {\n"
              "      mifare.connect();"
          )

          new_code = (
              "    MifareUltralight mifare = MifareUltralight.get(tag);\n"
              "    if (mifare == null) {\n"
              "      JSObject nfcScannedEvent = new JSObject();\n"
              "      JSObject tagInfo = new JSObject();\n"
              "      tagInfo.put(\"id\", bytesToHex(tag.getId()));\n"
              "      tagInfo.put(\"type\", \"Unsupported\");\n"
              "      nfcScannedEvent.put(\"tagInfo\", tagInfo);\n"
              "      nfcScannedEvent.put(\"data\", \"\");\n"
              "      return nfcScannedEvent;\n"
              "    }\n"
              "    try {\n"
              "      mifare.connect();"
          )

          matches = source.count(old_code)
          if matches != 1:
              raise SystemExit(
                  "NFCUtils.java nuk përputhet me kodin e pritur "
                  f"(u gjetën {matches} përputhje). Patch-i nuk u aplikua."
              )

          plugin_file.write_text(source.replace(old_code, new_code, 1), encoding="utf-8")
          print("Patch-i NFCUtils u aplikua me sukses.")
          PY

      - name: Siguro dosjen e Uebit (Kritike)
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Bridge</title></head><body><h1>Kontejneri Aktiv</h1></body></html>' > www/index.html

      - name: Shto dhe Sinkronizo Platformen Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Injekto Lejet e Harduerit (GPS, Kamera, NFC, Bluetooth)
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            # GPS
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>' "$MANIFEST_PATH"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>' "$MANIFEST_PATH"
            # Kamera
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" \/>' "$MANIFEST_PATH"
            # NFC
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.NFC" \/>' "$MANIFEST_PATH"
            # Bluetooth
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.BLUETOOTH" \/>' "$MANIFEST_PATH"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" \/>' "$MANIFEST_PATH"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" \/>' "$MANIFEST_PATH"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" \/>' "$MANIFEST_PATH"
            echo "Te gjitha lejet native u injektuan me sukses!"
          else
            echo "ERROR: AndroidManifest.xml nuk u gjet!"
            exit 1
          fi

      - name: Ndërto skedarin APK përmes Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Krijon një keystore të përkohshëm dhe nënshkruan APK-në e debug-ut.
      - name: Nënshkruaj APK-në në mënyrë automatike (Online)
        run: |
          keytool -genkey -v \
            -keystore my-release-key.keystore \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=MyAndroidApp, OU=Dev, O=Online, L=Online, S=Online, C=US"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" sign \
            --ks my-release-key.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out android/app/build/outputs/apk/debug/app-debug-signed.apk \
            android/app/build/outputs/apk/debug/app-debug.apk

          echo "APK u nënshkrua me sukses!"

      - name: Ruaj dhe Eksporto Skedarin APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikacioni-yt-Gati
          path: android/app/build/outputs/apk/debug/app-debug-signed.apk

      # Publikon një GitHub Release për çdo push.
      - name: Publiko Release-in në GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="build-${{ github.run_number }}"

          gh release delete "$TAG_NAME" --y || true

          gh release create "$TAG_NAME" android/app/build/outputs/apk/debug/app-debug-signed.apk \
            --title "Android APK (Build #${{ github.run_number }})" \
            --notes "Ky është një ndërtim automatik nga dega: ${{ github.ref_name }}. Commit SHA: ${{ github.sha }}"
