name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Shkarko Kodin e Projektit
        uses: actions/checkout@v4

      - name: Instalo Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalo Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalo Paketet e Node
        run: |
          npm install

      - name: Siguro dosjen e Uebit (Kritike)
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><title>Bridge</title></head><body><h1>OK</h1></body></html>' > www/index.html

      - name: Ndërto Projektin e Capacitor nga E Para
        run: |
          npx cap android create || true
          npx cap add android || true
          npx cap sync android

      - name: Ndërto skedarin APK përmes Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: Dosja native 'android' nuk u krijua dot nga Capacitor!"
            exit 1
          fi

      - name: Ruaj skedarin APK e gatshme
        uses: actions/upload-artifact@v4
        with:
          name: Aplikacioni-yt-Gati
          path: android/app/build/outputs/apk/debug/app-debug.apk
