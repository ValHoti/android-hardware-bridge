name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Shkarko Kodin e Projektit
        uses: actions/checkout@v4

      - name: Konfiguro Node.js Moderne (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Konfiguro Java Moderne (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalo Paketat e Projektit
        run: |
          npm install

      - name: Siguro Strukturen e Dosjes www (Kritike)
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><title>Bridge</title></head><body><h1>Kontejneri Aktiv</h1></body></html>' > www/index.html

      - name: Inicializo dhe Sinkronizo Platformen Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Ndërto Skedarin APK përmes Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ruaj dhe Eksporto Skedarin APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikacioni-yt-Gati
          path: android/app/build/outputs/apk/debug/app-debug.apk
